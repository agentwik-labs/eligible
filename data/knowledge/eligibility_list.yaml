# eligibility_list.yaml: hand-written from the IRS sources in data/knowledge/raw/ (see SOURCES.md).
#
# Question answered: can a health FSA or HSA pay for this item? (Not: is it deductible.)
# Pub 502 is written for the itemized deduction, so where it disagrees with the HSA/FSA rules
# (non-prescribed medicine), the HSA/FSA rule wins: Pub 969 and CARES Act §3702.
#
# verdicts:
#   eligible            the cited source includes it with no condition
#   not_eligible        the cited source excludes it
#   dual_purpose        eligible only when bought primarily for a medical condition (ordinary
#                       personal/household use is excluded); the receipt can't show which
#   needs_prescription  the source requires a physician's prescription, advice or diagnosis,
#                       so it is reimbursable only with a prescription or letter of medical necessity
#   needs_review        the receipt line can't be identified, so no rule can be applied
#
# sources: section IDs from data/knowledge/sections.jsonl (checked by tests/test_knowledge.py).
# products: [receipt text as printed, normalized name, typical price in USD, optional merchants]
#   (per-product merchants override the entry's when one entry spans store types)

