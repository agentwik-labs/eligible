# docker compose up  ->  http://localhost:8000 (demo), /engineering, /traces
#
# Tracing: set LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY and LANGFUSE_HOST (Langfuse Cloud or
# your own Langfuse deployment) and add the `langfuse` package; without them, traces go to
# logs/traces.jsonl and the /traces page.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Without a key the app still serves every page and replays any receipt whose answers
      # are in evals/.cache (the 60 samples, once the evals have run); new receipts need it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELIGIBLE_LLM_BACKEND: anthropic_api
      ELIGIBLE_BUDGET_USD: ${ELIGIBLE_BUDGET_USD:-10}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    volumes:
      - ./logs:/app/logs
      - ./evals/.cache:/app/evals/.cache
