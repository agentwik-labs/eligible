[project]
name = "eligible"
version = "0.1.0"
description = "FSA/HSA receipt eligibility checker with cited IRS sources and a public eval report"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eligible"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"data/generate.py" = ["S311"]
"data/adversarial.py" = ["S311"]  # seeded pseudo-randomness is the point: synthetic data
"evals/run.py" = ["E501"]  # report table rows read better unwrapped
"evals/retrieval.py" = ["E501"]
"evals/judge.py" = ["E501", "S311"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=eligible --cov-report=term-missing:skip-covered"
